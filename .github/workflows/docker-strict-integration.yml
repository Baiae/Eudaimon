name: Docker strict evaluator integration (synthetic)

on:
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "tests_docker/**"
      - ".github/workflows/docker-strict-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-integration:
    name: Ubuntu Docker / pinned image / synthetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check Docker runtime and pinned image
        shell: bash
        run: |
          set -euo pipefail
          docker info --format 'Docker server: {{.ServerVersion}}; architecture: {{.Architecture}}'
          image='docker.io/library/python@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c'
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" --format 'Image ID: {{.Id}}; architecture: {{.Architecture}}'

      - name: Run synthetic Docker isolation and promotion tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests_docker -v

      - name: Verify no strict containers remain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stale="$(docker ps -aq --filter 'name=eudaimon-strict-' --filter 'name=eudaimon-synthetic-probe-')"
          if [ -n "$stale" ]; then
            echo "::error::Synthetic Eudaimon Docker containers remain after testing"
            docker ps -a --filter 'name=eudaimon-strict-' --filter 'name=eudaimon-synthetic-probe-'
            exit 1
          fi
          echo "PASS: no synthetic Eudaimon containers remain"
